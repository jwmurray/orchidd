[package]
name = "orchidd"
version = "0.1.0"
edition = "2021"
description = "Daemon that collects Shelly H&T temperature/humidity and serves live graphs"
license = "MIT"
repository = "https://github.com/jwmurray/orchidd"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
