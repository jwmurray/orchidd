<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orchidd — Temperature &amp; Humidity</title>

<!-- Installable web app: added to the iPhone Home Screen it launches full-screen
     with its own icon, no browser chrome. -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="orchidd" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<style>
  /* Light theme is the default. */
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --border: #e2e6eb; --grid: #c2cad6;
    --text: #1b2430; --muted: #5b6675; --temp: #d83a2f; --hum: #1668c9;
    --tipbg: #1b2430; --tiptext: #ffffff; --tiptemp: #ffa08f; --tiphum: #8fc6ff;
    --blu: #2f9e44; --tipblu: #8ce99a;
    --heat: #f08c00; --alert: #c62828; --ok: #2e7d32;
    --day: rgba(255, 212, 59, 0.16); --night: rgba(76, 110, 245, 0.08);
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --border: #2a313c; --grid: #495468;
    --text: #c9d1d9; --muted: #8b949e; --temp: #ff6b4a; --hum: #4aa3ff;
    --tipbg: #0b0e12; --tiptext: #ffffff; --tiptemp: #ffa08f; --tiphum: #8fc6ff;
    --blu: #51cf66; --tipblu: #8ce99a;
    --heat: #ffa94d; --alert: #ff6b6b; --ok: #69db7c;
    --day: rgba(255, 212, 59, 0.07); --night: rgba(116, 143, 252, 0.12);
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 1em/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; }
  /* Respect the notch/home indicator when launched as a Home Screen app. */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right)); }
  h1 { font-size: 1.12em; margin: 0; font-weight: 600; }
  .now { color: var(--muted); font-size: 0.94em; }
  .now .t { color: var(--temp); font-weight: 600; }
  .now .h { color: var(--hum); font-weight: 600; }
  .spacer { flex: 1; }
  label { color: var(--muted); }
  select, .toggle { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
    font-size: 0.88em; cursor: pointer; }
  #customDays { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
    font-size: 0.88em; width: 82px; }
  .toggle:hover { border-color: var(--grid); }
  main { padding: 16px 20px;
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
    padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .chartwrap { position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; }
  canvas { width: 100%; height: 62vh; display: block; touch-action: pan-y; }
  .legend { display: flex; gap: 18px; padding: 8px 4px 2px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #tip { position: absolute; pointer-events: none; background: var(--tipbg); color: var(--tiptext);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 0.88em;
    white-space: nowrap; opacity: 0; transition: opacity .05s; }
  #tip .t { color: var(--tiptemp); font-weight: 600; }
  #tip .h { color: var(--tiphum); font-weight: 600; }
  #tip .b { color: var(--tipblu); font-weight: 600; }
  .now .b { color: var(--blu); font-weight: 600; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  /* Connectivity / session banner. Hidden unless something needs saying. */
  #banner { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    font-size: 0.94em; }
  #banner[data-show] { display: block; }
  #banner button { margin-left: 8px; font: inherit; color: var(--hum);
    background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; }
  /* Thermostat status strip: wraps into rows on a phone. */
  #status { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 0 0 12px; }
  #status .chip { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 0.94em; color: var(--muted); }
  #status .chip b { color: var(--text); font-weight: 600; }
  #status .chip.temp b { color: var(--temp); }
  #status .chip.on { border-color: var(--heat); }
  #status .chip.on b { color: var(--heat); }
  #status .alert { flex-basis: 100%; color: var(--alert); border-color: var(--alert);
    font-weight: 600; }
  /* Settings panel */
  details.settings { margin-top: 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  details.settings summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr));
    gap: 10px 18px; margin: 12px 0; }
  .sgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.88em; }
  .sgrid label.check { flex-direction: row; align-items: center; gap: 8px; }
  .sgrid input, .sgrid select { font: inherit; font-size: 1em; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; width: 100%; }
  .sgrid input[type=checkbox] { width: auto; }
  .sgroup { grid-column: 1 / -1; color: var(--text); font-weight: 600;
    font-size: 0.94em; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
  .sactions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sactions button { font: inherit; background: var(--hum); color: #fff; border: none;
    border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  #smsg { font-size: 0.94em; }
  #smsg.err { color: var(--alert); }
  #smsg.ok { color: var(--ok); }
  /* Phone layout: the header wraps to two lines and the chart gets more height. */
  @media (max-width: 560px) {
    header { gap: 10px 14px; padding: 12px 14px;
      padding-top: calc(12px + env(safe-area-inset-top)); }
    h1 { font-size: 1.06em; }
    .spacer { flex-basis: 100%; height: 0; }
    main { padding: 12px 14px; }
    canvas { height: 66vh; }
    .legend { flex-wrap: wrap; gap: 10px 14px; font-size: 0.88em; }
    #count { margin-left: 0 !important; }
  }
</style>
</head>
<body>
<header>
  <h1>🌡️ orchidd</h1>
  <span class="now" id="now">—</span>
  <span class="spacer"></span>
  <button id="fminus" class="toggle" title="Smaller text">A−</button>
  <button id="fplus" class="toggle" title="Larger text">A+</button>
  <button id="theme" class="toggle" title="Toggle light/dark">Dark</button>
  <label>Show
    <select id="days"></select>
  </label>
  <input id="customDays" type="number" min="1" max="3650" step="1" placeholder="days" hidden />
</header>
<main>
  <div id="banner"></div>
  <div id="status"></div>
  <div class="chartwrap">
    <canvas id="chart"></canvas>
    <div id="tip"></div>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:var(--temp)"></i> Temperature (°F)</span>
    <span><i class="swatch" style="background:var(--hum)"></i> Humidity (%RH)</span>
    <span id="bluLegend" hidden><i class="swatch" style="background:var(--blu)"></i> BLU sensor (°F solid, %RH dashed)</span>
    <span><i class="swatch" style="background:var(--day);height:10px;outline:1px solid var(--border)"></i> Day</span>
    <span><i class="swatch" style="background:var(--night);height:10px;outline:1px solid var(--border)"></i> Night</span>
    <span><i class="swatch" style="background:var(--heat)"></i> <span id="heaterLegend">Heater plug (raised = on)</span></span>
    <span id="count" style="margin-left:auto"></span>
  </div>
  <div class="empty" id="empty" hidden>No data yet — waiting for the first report from the sensor.</div>

  <details class="settings" id="settingsPanel">
    <summary>Thermostat settings</summary>
    <form id="sform" novalidate>
      <div class="sgrid">
        <div class="sgroup">Heater</div>
        <label>Mode
          <select name="mode"><option value="auto">Auto</option><option value="off">Off (keep heater off)</option></select>
        </label>
        <label>Day setpoint (°F)<input name="day_setpoint_f" type="number" step="0.5" min="32" max="95" inputmode="decimal" /></label>
        <label>Night setpoint (°F)<input name="night_setpoint_f" type="number" step="0.5" min="32" max="95" inputmode="decimal" /></label>
        <label>Hysteresis (°F above setpoint before off)<input name="hysteresis_f" type="number" step="0.1" min="0.2" max="5" inputmode="decimal" /></label>
        <label>Max temperature cutoff (°F)<input name="max_temp_f" type="number" step="0.5" inputmode="decimal" /></label>
        <div class="sgroup">Schedule</div>
        <label>Day starts<input name="day_start" type="time" step="60" /></label>
        <label>Day ends (night starts)<input name="day_end" type="time" step="60" /></label>
        <label>Time zone<input name="timezone" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
        <div class="sgroup">Safety &amp; alerts</div>
        <label>Sensor stale after (minutes)<input name="stale_minutes" type="number" step="1" min="6" max="240" inputmode="numeric" /></label>
        <label>Alert when below setpoint by (°F)<input name="alert_below_f" type="number" step="0.5" min="0" max="20" inputmode="decimal" /></label>
        <label class="check"><input name="alerts_enabled" type="checkbox" /> Alerts enabled</label>
        <label>Alert phone<input name="alert_phone" type="tel" /></label>
        <label>Alert email<input name="alert_email" type="email" autocapitalize="off" /></label>
        <div class="sgroup">Device</div>
        <label>Plug URL<input name="plug_url" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
      </div>
      <div class="sactions">
        <button type="submit">Save</button>
        <span id="smsg"></span>
      </div>
    </form>
  </details>
</main>

<script>
const $ = (id) => document.getElementById(id);
let TEMP, HUM, BLU, GRID, MUTED, HEAT, DAY, NIGHT;
function refreshColors() {
  const cs = getComputedStyle(document.documentElement);
  TEMP = cs.getPropertyValue('--temp').trim();
  HUM  = cs.getPropertyValue('--hum').trim();
  BLU  = cs.getPropertyValue('--blu').trim();
  GRID = cs.getPropertyValue('--grid').trim();
  MUTED = cs.getPropertyValue('--muted').trim();
  HEAT = cs.getPropertyValue('--heat').trim();
  DAY = cs.getPropertyValue('--day').trim();
  NIGHT = cs.getPropertyValue('--night').trim();
}
refreshColors();

// ---- preferences ----------------------------------------------------------
// Stored in localStorage, which is per-browser and per-device by definition:
// Safari on the iPhone, Chrome on the iMac and Safari on the laptop each keep
// their own theme, time window and hi/lo choice. Nothing is shared server-side.
function prefGet(key, fallback) {
  try { const v = localStorage.getItem('orchidd-' + key); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function prefSet(key, value) {
  try { localStorage.setItem('orchidd-' + key, String(value)); } catch (e) {}
}

// ---- theme (default light; toggle persisted per browser) ------------------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  prefSet('theme', t);
  $('theme').textContent = t === 'dark' ? 'Light' : 'Dark';
  refreshColors();
  draw();
}

// ---- font size ------------------------------------------------------------
// One sticky step scales the whole page: the root font drives every CSS size
// (all in em) and the canvas text sizes derive from the same step. Step 0 is
// the original design; the default ships two steps larger.
let fontStep = parseInt(prefGet('fontstep', '2'), 10);
if (!isFinite(fontStep)) fontStep = 2;
function axisFontPx() { return 13 + fontStep; }
function statFontPx() { return 12 + fontStep; }
function applyFontStep(delta) {
  fontStep = Math.max(-2, Math.min(6, fontStep + (delta || 0)));
  prefSet('fontstep', fontStep);
  document.documentElement.style.fontSize = (16 + fontStep) + 'px';
  draw();
}

let data = { t: [], tempF: [], hum: [] };      // points inside the window
// The BLU (Bluetooth) sensor beside the Wi-Fi one, for comparison only.
let blu = { t: [], tempF: [], hum: [] };       // its points inside the window
let latestBlu = null;                          // its newest reading
let heaterOn = [];                             // [[startMs, endMs], ...] heater-on bands
let heaterKnown = false;                       // false when /api/heater failed
let schedule = null;                           // { start: "07:00", end: "21:00", tz } from settings
// Vertical gridlines: 'daynight' marks each day/night switch from the
// thermostat schedule; 'ticks' is the original line at every time label.
const GRID_MODE = 'daynight';
let latest = null;                             // newest reading regardless of window
// "1", "0.5", "week", "lastweek", "lastmonth" or "custom:180" — resolved to a
// concrete [t0,t1] by resolveRange() every load so calendar ranges track time.
let rangeChoice = prefGet('range', null);
let win = null;                                // resolved { t0, t1 }
let hover = null; // index of hovered point

// Resolve the current range choice to concrete window bounds. Calendar ranges
// use local time; weeks start on Sunday.
function resolveRange() {
  const now = new Date();
  const t1 = now.getTime();
  if (rangeChoice === 'week') {
    const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay());
    return { t0: d.getTime(), t1 };
  }
  if (rangeChoice === 'lastweek') {
    const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay());
    return { t0: d.getTime() - 7 * 86400000, t1: d.getTime() };
  }
  if (rangeChoice === 'lastmonth') {
    return { t0: new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime(),
             t1: new Date(now.getFullYear(), now.getMonth(), 1).getTime() };
  }
  const s = String(rangeChoice || '');
  const days = parseFloat(s.startsWith('custom:') ? s.slice(7) : s);
  const dd = isFinite(days) && days > 0 ? days : 7;
  return { t0: t1 - dd * 86400000, t1 };
}

// ---- fetch helpers --------------------------------------------------------
// Three different failures look identical to a naive `await fetch(...).json()`,
// and each needs a different message:
//   * no network            -> show last cached data, say it's stale
//   * Access session expired -> Cloudflare answers with an HTML login page
//                               (or redirects to one); offer a sign-in tap
//   * server down            -> same as no network from the app's point of view
class SessionExpired extends Error {}

function setBanner(html) {
  const b = $('banner');
  if (!html) { b.removeAttribute('data-show'); b.innerHTML = ''; return; }
  b.innerHTML = html;
  b.setAttribute('data-show', '');
}

async function getJSON(path) {
  const res = await fetch(path, { cache: 'no-store' });
  const type = res.headers.get('content-type') || '';
  // A redirect to the Access login, or an HTML body where JSON belongs, both
  // mean "you are no longer signed in" rather than "the server is broken".
  if (res.redirected || !type.includes('application/json')) throw new SessionExpired();
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function reportError(err) {
  if (err instanceof SessionExpired) {
    setBanner('Session expired. <button onclick="location.reload()">Sign in again</button>');
  } else {
    const when = lastLoaded
      ? 'Showing data from ' + lastLoaded.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : 'No connection to orchidd';
    setBanner(`Offline — ${when}. <button onclick="refresh()">Retry</button>`);
  }
}

let lastLoaded = null;

async function loadMeta() {
  const m = await getJSON('/api/meta');
  const sel = $('days');
  sel.innerHTML = '';
  const max = m.maxDays || 7;
  // Sub-day windows first, then whole days up to the max, then calendar
  // ranges and a free-form "go back N days" entry.
  const opts = [
    { label: '1 hour', value: String(1 / 24) },
    { label: '2 hours', value: String(2 / 24) },
    { label: '4 hours', value: String(4 / 24) },
    { label: '12 hours', value: '0.5' },
  ];
  for (let d = 1; d <= max; d++) {
    opts.push({ label: d === 1 ? '24 hours' : d + ' days', value: String(d) });
  }
  opts.push(
    { label: 'This week', value: 'week' },
    { label: 'Last week', value: 'lastweek' },
    { label: 'Last month', value: 'lastmonth' },
    { label: 'Custom…', value: 'custom' },
  );
  for (const o of opts) {
    const el = document.createElement('option');
    el.value = o.value; el.textContent = o.label;
    sel.appendChild(el);
  }

  // Remembered range wins over the server's suggestion, but only if it is
  // still offered — the day-length options grow as history accumulates, so a
  // saved "5 days" must not silently select nothing after a database reset.
  const custom = $('customDays');
  const saved = prefGet('range', null);
  const available = [...sel.options].map((o) => o.value);
  if (saved !== null && String(saved).startsWith('custom:')) {
    rangeChoice = saved;
    sel.value = 'custom';
    custom.value = saved.slice(7);
    custom.hidden = false;
  } else if (saved !== null && available.includes(saved)) {
    rangeChoice = saved;
    sel.value = saved;
  } else {
    rangeChoice = String(m.defaultDays || 7);
    sel.value = rangeChoice;
  }

  sel.onchange = () => {
    if (sel.value === 'custom') {
      // Wait for a number; the chart keeps its current range meanwhile.
      custom.hidden = false;
      custom.focus();
      return;
    }
    custom.hidden = true;
    rangeChoice = sel.value;
    prefSet('range', rangeChoice);
    loadData();
  };
  const applyCustom = () => {
    const n = parseFloat(custom.value);
    if (!isFinite(n) || n <= 0) return;
    rangeChoice = 'custom:' + n;
    prefSet('range', rangeChoice);
    loadData();
  };
  custom.onchange = applyCustom;
  custom.onkeydown = (e) => { if (e.key === 'Enter') applyCustom(); };
}

async function loadData() {
  win = resolveRange();
  // Fetch from the window start to now; calendar windows that end in the past
  // are cut down client-side so "now" can still show the latest reading.
  const fetchDays = Math.max((Date.now() - win.t0) / 86400000, 0.01) + 0.01;
  let raw;
  try {
    raw = await getJSON('/api/data?days=' + fetchDays.toFixed(3));
    // Heater bands are decoration: a failure here must not hide the graph.
    try {
      heaterOn = (await getJSON('/api/heater?days=' + fetchDays.toFixed(3))).intervals || [];
      heaterKnown = true;
    } catch (e) { heaterOn = []; heaterKnown = false; }
    try {
      const st = await getJSON('/api/settings');
      schedule = { start: st.day_start, end: st.day_end, tz: st.timezone };
    } catch (e) { schedule = null; }
    lastLoaded = new Date();
    setBanner(null);
  } catch (err) {
    reportError(err);
    return;
  }
  const m = raw.t.length;
  latest = m ? { t: raw.t[m - 1], tempF: raw.tempF[m - 1], hum: raw.hum[m - 1] } : null;
  data = { t: [], tempF: [], hum: [] };
  for (let i = 0; i < m; i++) {
    if (raw.t[i] >= win.t0 && raw.t[i] <= win.t1) {
      data.t.push(raw.t[i]); data.tempF.push(raw.tempF[i]); data.hum.push(raw.hum[i]);
    }
  }
  const b = raw.blu || { t: [], tempF: [], hum: [] };
  const bm = b.t.length;
  latestBlu = bm ? { t: b.t[bm - 1], tempF: b.tempF[bm - 1], hum: b.hum[bm - 1] } : null;
  blu = { t: [], tempF: [], hum: [] };
  for (let i = 0; i < bm; i++) {
    if (b.t[i] >= win.t0 && b.t[i] <= win.t1) {
      blu.t.push(b.t[i]); blu.tempF.push(b.tempF[i]); blu.hum.push(b.hum[i]);
    }
  }
  $('bluLegend').hidden = bm === 0;
  const n = data.t.length;
  const empty = $('empty');
  empty.hidden = n > 0;
  if (!n) empty.textContent = latest
    ? 'No readings in the selected period.'
    : 'No data yet — waiting for the first report from the sensor.';
  $('count').textContent = n ? n + ' points' : '';
  if (latest) {
    $('now').innerHTML =
      `now <span class="t">${latest.tempF.toFixed(1)}°F</span> · ` +
      `<span class="h">${latest.hum.toFixed(1)}%</span>` +
      (latestBlu
        ? ` · BLU <span class="b">${latestBlu.tempF.toFixed(1)}°F</span>` +
          (latestBlu.hum != null ? ` <span class="b">${latestBlu.hum.toFixed(0)}%</span>` : '') +
          ` (${fmtDiff(latestBlu.tempF - latest.tempF)}°F)`
        : '');
  } else {
    $('now').textContent = '—';
  }
  draw();
}

/** "+1.2" / "-0.4": the BLU sensor's reading minus the Wi-Fi sensor's. */
function fmtDiff(d) { return (d >= 0 ? '+' : '') + d.toFixed(1); }

/** Index of the BLU reading nearest `t`, or -1 if none within 10 minutes. */
function nearestBlu(t) {
  let best = -1, bestd = 10 * 60000;
  for (let i = 0; i < blu.t.length; i++) {
    const dd = Math.abs(blu.t[i] - t);
    if (dd <= bestd) { bestd = dd; best = i; }
  }
  return best;
}

// ---- hi/lo summary lines --------------------------------------------------
// The hi/lo pair always describes exactly the window on screen, so it is
// computed from the visible points rather than fetched for fixed windows.
function windowHiLo() {
  const n = data.t.length;
  if (!n) return null;
  let tMax = -Infinity, tMin = Infinity, hMax = -Infinity, hMin = Infinity;
  for (let i = 0; i < n; i++) {
    const tv = data.tempF[i], hv = data.hum[i];
    if (tv > tMax) tMax = tv; if (tv < tMin) tMin = tv;
    if (hv > hMax) hMax = hv; if (hv < hMin) hMin = hv;
  }
  return { tMax, tMin, hMax, hMin };
}

// ---- scale helpers --------------------------------------------------------
// Range padded by 10% beyond the data extent, per requirement, but never
// tighter than `minSpan` so near-flat data doesn't produce a weird micro-range.
function paddedRange(arr, minSpan) {
  let lo = Infinity, hi = -Infinity;
  for (const v of arr) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!isFinite(lo)) return [0, minSpan || 1];
  const range = hi - lo;
  const pad = range > 0 ? range * 0.10 : Math.max((minSpan || 2) / 2, Math.abs(hi) * 0.05);
  let a = lo - pad, b = hi + pad;
  if (minSpan && b - a < minSpan) { const m = (a + b) / 2; a = m - minSpan / 2; b = m + minSpan / 2; }
  return [a, b];
}

// Nice axis covering [lo,hi] with round min/max/step (~targetTicks intervals).
// Temperature uses this to pick the shared gridlines.
function niceAxisCover(lo, hi, targetTicks) {
  const step = niceNum(((hi - lo) || 1) / Math.max(1, targetTicks), true);
  const min = Math.floor(lo / step) * step;
  const max = Math.ceil(hi / step) * step;
  const count = Math.max(1, Math.round((max - min) / step));
  return { min, max, step, count };
}

// Fit [lo,hi] into EXACTLY k intervals using the smallest nice step that covers
// the range from a nice-aligned min — so humidity's round labels land on the
// SAME horizontal lines the temperature axis already defined.
function fitToCount(lo, hi, k) {
  let step = niceNum(((hi - lo) || 1) / k, true) || 1;
  for (let it = 0; it < 40; it++) {
    const min = Math.floor(lo / step) * step;
    if (min + k * step >= hi - 1e-9) return { min, max: min + k * step, step, count: k };
    step = niceNumNext(step);
  }
  const min = Math.floor(lo / step) * step;
  return { min, max: min + k * step, step, count: k };
}

function niceNum(x, round) {
  x = Math.abs(x) || 1;
  const exp = Math.floor(Math.log10(x));
  const f = x / Math.pow(10, exp);
  const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
                   : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
  return nf * Math.pow(10, exp);
}
function niceNumNext(step) {          // next nice number up: 1→2→5→10…
  const exp = Math.floor(Math.log10(step) + 1e-9);
  const f = Math.round(step / Math.pow(10, exp));
  const nf = f < 2 ? 2 : f < 5 ? 5 : 10;
  return nf * Math.pow(10, exp);
}
function decimalsForStep(step) { return step >= 1 ? 0 : step >= 0.1 ? 1 : 2; }

// ---- drawing --------------------------------------------------------------
const canvas = $('chart');
const ctx = canvas.getContext('2d');
let geo = null; // saved geometry for hit-testing

function draw() {
  refreshColors();
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const n = data.t.length;
  const wv = win || resolveRange();
  const wspanDays = (wv.t1 - wv.t0) / 86400000;
  const crossesDay = new Date(wv.t0).toDateString() !== new Date(wv.t1).toDateString();
  const axisFs = axisFontPx();
  const padL = 56 + fontStep * 2, padR = 56 + fontStep * 2, padT = 12;
  // Two-line x labels (time + date) need a taller bottom band — always on
  // long ranges, and on short ones whenever the window crosses midnight.
  const padB = wspanDays > 1.5 || crossesDay ? axisFs * 2 + 20 : axisFs + 17;
  const W = cssW - padL - padR, H = cssH - padT - padB;
  if (n === 0 || W <= 0 || H <= 0) { geo = null; return; }

  // Time axis is anchored to the resolved window; for trailing ranges that
  // puts "now" at the right edge even when only a few points exist yet.
  const w = win || resolveRange();
  const t0 = w.t0, t1 = w.t1;
  const tSpan = Math.max(1, t1 - t0);
  // Temperature drives the gridlines (10% padding, rounded to clean values);
  // humidity is then fitted onto those SAME lines with its own round step.
  const hiLo = windowHiLo();
  // Scales cover both sensors so neither line runs off the plot.
  const bluHum = blu.hum.filter((v) => v != null);
  const [tLoPad, tHiPad] = paddedRange(data.tempF.concat(blu.tempF), 4); // 10% pad, >= 4 °F
  const [hLoPad, hHiPad] = paddedRange(data.hum.concat(bluHum), 8);     // >= 8 %RH tall
  // Fewer target gridlines => humidity fits the shared lines with less empty
  // headroom (each temperature line still gets a matching humidity value).
  const tAxis = niceAxisCover(tLoPad, tHiPad, 5);
  const k = tAxis.count;
  const hAxis = fitToCount(hLoPad, hHiPad, k);
  const tDec = decimalsForStep(tAxis.step);
  const hDec = decimalsForStep(hAxis.step);

  const x = (t) => padL + (t - t0) / tSpan * W;
  const yT = (v) => padT + (1 - (v - tAxis.min) / (tAxis.max - tAxis.min)) * H;
  const yH = (v) => padT + (1 - (v - hAxis.min) / (hAxis.max - hAxis.min)) * H;
  geo = { padL, padT, W, H, x, t0, tSpan };

  // Day/night shading sits under the gridlines and every series.
  const edges = dayNightEdges(t0, t1);
  drawDayNight(edges, x, t0, t1, padT, H);

  // Shared horizontal gridlines: one per interval, temp label left, humidity right.
  ctx.font = axisFs + 'px sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= k; i++) {
    const yy = padT + H - (H * i / k);
    ctx.strokeStyle = GRID; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + W, yy); ctx.stroke();
    ctx.fillStyle = TEMP; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText((tAxis.min + i * tAxis.step).toFixed(tDec) + '°', padL - 6, yy);
    ctx.fillStyle = HUM; ctx.textAlign = 'left';
    ctx.fillText((hAxis.min + i * hAxis.step).toFixed(hDec) + '%', padL + W + 6, yy);
  }

  // x-axis: each tick snaps to the nearest half hour so the label reads a
  // clean clock time, and a vertical gridline (same weight as the horizontal
  // ones) marks exactly where that time falls. Ranges past ~1.5 days add the
  // date on a second line since the times alone would be ambiguous; short
  // ranges add it only on the first tick of a new day, so a midnight
  // crossing is visible without repeating the date everywhere.
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const labels = 6;
  const HALF_HOUR = 30 * 60 * 1000;
  const twoLine = tSpan > 36 * 3600 * 1000;
  const drawn = new Set();
  let prevTickDay = null;
  for (let i = 0; i <= labels; i++) {
    const tt = Math.round((t0 + tSpan * i / labels) / HALF_HOUR) * HALF_HOUR;
    if (tt < t0 || tt > t1 || drawn.has(tt)) continue; // snapped out of range
    drawn.add(tt);
    const xx = x(tt);
    ctx.strokeStyle = GRID;
    ctx.beginPath();
    if (GRID_MODE === 'ticks') { ctx.moveTo(xx, padT); ctx.lineTo(xx, padT + H); }
    else { ctx.moveTo(xx, padT + H); ctx.lineTo(xx, padT + H + 4); } // tick mark only
    ctx.stroke();
    const d = new Date(tt);
    ctx.fillStyle = MUTED;
    ctx.fillText(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), xx, padT + H + 6);
    const newDay = prevTickDay !== null && d.toDateString() !== prevTickDay;
    if (twoLine || newDay)
      ctx.fillText(d.toLocaleDateString([], { month: 'numeric', day: 'numeric' }), xx, padT + H + 9 + axisFs);
    prevTickDay = d.toDateString();
  }

  if (GRID_MODE === 'daynight') drawDayNightLines(edges, x, t0, t1, padT, H);

  // Heater-on bands, shaded under everything else.
  drawHeaterBands(x, t0, t1, padT, H);
  drawHeaterLine(x, t0, t1, padT, H);

  // hi/lo reference lines, drawn under the series so live data stays dominant
  drawHiLoLines(hiLo, yT, yH, padL, W, padT, H);

  // series
  drawLine(data.t, data.tempF, yT, TEMP);
  drawLine(data.t, data.hum, yH, HUM);
  drawLine(blu.t, blu.tempF, yT, BLU);
  ctx.save(); ctx.setLineDash([5, 4]);
  drawLine(blu.t.filter((_, i) => blu.hum[i] != null), bluHum, yH, BLU);
  ctx.restore();

  // Mark the most recent sample (all samples when very sparse) so a lone or
  // just-started reading is always visible.
  const markIdx = n <= 2 ? [...Array(n).keys()] : [n - 1];
  for (const i of markIdx) {
    const px = x(data.t[i]);
    dot(px, yT(data.tempF[i]), TEMP);
    dot(px, yH(data.hum[i]), HUM);
  }

  // hover marker
  if (hover != null && hover >= 0 && hover < n) {
    const hx = x(data.t[hover]);
    ctx.strokeStyle = MUTED; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, padT + H); ctx.stroke();
    ctx.globalAlpha = 1;
    dot(hx, yT(data.tempF[hover]), TEMP);
    dot(hx, yH(data.hum[hover]), HUM);
    const bi = nearestBlu(data.t[hover]);
    if (bi >= 0) {
      const bx = x(blu.t[bi]);
      dot(bx, yT(blu.tempF[bi]), BLU);
      if (blu.hum[bi] != null) dot(bx, yH(blu.hum[bi]), BLU);
    }
  }
}

function drawLine(ts, vs, yf, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1.75; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < ts.length; i++) {
    const px = geo.x(ts[i]), py = yf(vs[i]);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
/// Draw the hi/lo reference lines for the visible window, with an inline
/// label on each. Temperature labels hug the left of the plot and humidity
/// labels the right, matching the side each metric's axis is on.
function drawHiLoLines(hl, yT, yH, padL, W, padT, H) {
  if (!hl) return;
  const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();

  ctx.save();
  const statFs = statFontPx();
  ctx.font = statFs + 'px sans-serif';
  ctx.textBaseline = 'bottom';
  ctx.lineWidth = 1.25;
  ctx.setLineDash([7, 4]);

  const line = (value, yf, color, text, side) => {
    if (value == null) return;
    const y = yf(value);
    if (y < padT - 0.5 || y > padT + H + 0.5) return; // outside the plot

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + W, y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    const w = ctx.measureText(text).width;
    const x = side === 'left' ? padL + 5 : padL + W - 5 - w;
    // A chip of panel colour keeps the label readable where it crosses a
    // gridline or the series itself.
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = panel;
    ctx.fillRect(x - 3, y - (statFs + 2), w + 6, statFs + 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.fillText(text, x, y - 1.5);
  };

  line(hl.tMax, yT, TEMP, `hi ${hl.tMax.toFixed(1)}°`, 'left');
  line(hl.tMin, yT, TEMP, `lo ${hl.tMin.toFixed(1)}°`, 'left');
  line(hl.hMax, yH, HUM, `hi ${hl.hMax.toFixed(1)}%`, 'right');
  line(hl.hMin, yH, HUM, `lo ${hl.hMin.toFixed(1)}%`, 'right');

  ctx.setLineDash([]);
  ctx.restore();
}

// ---- day / night ----------------------------------------------------------
// Offset (ms) of time zone `tz` from UTC at instant `t`.
function tzOffsetMs(tz, t) {
  const p = {};
  for (const x of new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(new Date(t))) p[x.type] = x.value;
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return asUtc - Math.floor(t / 1000) * 1000;
}

// Epoch ms of wall-clock y-m-d h:mi in `tz` (two passes settle DST edges).
function zonedTime(tz, y, mo, d, h, mi) {
  const guess = Date.UTC(y, mo, d, h, mi);
  const first = guess - tzOffsetMs(tz, guess);
  return guess - tzOffsetMs(tz, first);
}

// Every day-start and day-end inside [t0, t1], plus one on each side so the
// shading covers the whole window. Sorted; kind = the period that begins.
function dayNightEdges(t0, t1) {
  if (!schedule || !schedule.start || !schedule.end) return [];
  const tz = schedule.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const [sh, sm] = schedule.start.split(':').map(Number);
  const [eh, em] = schedule.end.split(':').map(Number);
  const p = {};
  for (const x of new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date(t0 - 86400000))) p[x.type] = x.value;
  const edges = [];
  const days = Math.ceil((t1 - t0) / 86400000) + 3;
  for (let i = 0; i < days; i++) {
    const y = +p.year, mo = +p.month - 1, d = +p.day + i; // Date.UTC rolls d over months
    const day = new Date(Date.UTC(y, mo, d));
    const [Y, M, D] = [day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate()];
    edges.push({ t: zonedTime(tz, Y, M, D, sh, sm), kind: 'day' });
    edges.push({ t: zonedTime(tz, Y, M, D, eh, em), kind: 'night' });
  }
  return edges.sort((a, b) => a.t - b.t);
}

function drawDayNight(edges, x, t0, t1, padT, H) {
  if (!edges.length) return;
  ctx.save();
  for (let i = 0; i < edges.length; i++) {
    const s = Math.max(edges[i].t, t0);
    const e = Math.min(i + 1 < edges.length ? edges[i + 1].t : t1, t1);
    if (e <= s) continue;
    ctx.fillStyle = edges[i].kind === 'day' ? DAY : NIGHT;
    ctx.fillRect(x(s), padT, x(e) - x(s), H);
  }
  // Before the first edge, the period is the opposite of what that edge starts.
  if (edges[0].t > t0) {
    ctx.fillStyle = edges[0].kind === 'day' ? NIGHT : DAY;
    ctx.fillRect(x(t0), padT, x(Math.min(edges[0].t, t1)) - x(t0), H);
  }
  ctx.restore();
}

function drawDayNightLines(edges, x, t0, t1, padT, H) {
  ctx.save();
  ctx.strokeStyle = GRID;
  ctx.lineWidth = 1;
  for (const { t } of edges) {
    if (t <= t0 || t >= t1) continue;
    const xx = Math.round(x(t)) + 0.5;
    ctx.beginPath(); ctx.moveTo(xx, padT); ctx.lineTo(xx, padT + H); ctx.stroke();
  }
  ctx.restore();
}

function drawHeaterBands(x, t0, t1, padT, H) {
  if (!heaterOn.length) return;
  ctx.save();
  ctx.fillStyle = HEAT;
  ctx.globalAlpha = 0.18;
  for (const [a, b] of heaterOn) {
    const s = Math.max(a, t0), e = Math.min(b, t1);
    if (e <= s) continue;
    const xs = x(s), w = Math.max(1, x(e) - xs);
    ctx.fillRect(xs, padT, w, H);
  }
  ctx.restore();
}

// Plug on/off as a step line along the bottom of the plot: low = off, raised =
// on. The bands alone are too faint to read at a glance.
function drawHeaterLine(x, t0, t1, padT, H) {
  setHeaterLegend(t0, t1);
  if (!heaterKnown) return;
  const yOff = padT + H - 3, yOn = padT + H - Math.max(14, H * 0.08);
  ctx.save();
  ctx.strokeStyle = HEAT;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x(t0), yOff);
  for (const [a, b] of heaterOn) {
    const s = Math.max(a, t0), e = Math.min(b, t1);
    if (e <= s) continue;
    ctx.lineTo(x(s), yOff); ctx.lineTo(x(s), yOn);
    ctx.lineTo(x(e), yOn); ctx.lineTo(x(e), yOff);
  }
  ctx.lineTo(x(t1), yOff);
  ctx.stroke();
  ctx.restore();
}

// "the last 7 days", "this week", ... from the range picker's label.
function periodPhrase() {
  const text = ($('days').selectedOptions[0] || {}).text || '';
  if (/^\d/.test(text)) return 'the last ' + text;
  if (/^(This|Last) /.test(text)) return text.toLowerCase();
  return 'the period shown';
}

function onDurationText(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} h ${m} min` : `${h} h`;
}

// Legend says how much the plug ran in the window on screen, or that it stayed off.
function setHeaterLegend(t0, t1) {
  let note;
  if (!heaterKnown) {
    note = 'unknown';
  } else {
    let onMs = 0;
    for (const [a, b] of heaterOn) onMs += Math.max(0, Math.min(b, t1) - Math.max(a, t0));
    note = onMs > 0
      ? `on ${onDurationText(onMs)} during ${periodPhrase()}`
      : `off for ${periodPhrase()}`;
  }
  $('heaterLegend').textContent = `Heater plug (raised = on) — ${note}`;
}

function dot(px, py, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 7); ctx.fill();
}

// ---- hover / tooltip ------------------------------------------------------
// Driven by both mouse and touch: on a phone, dragging along the chart scrubs
// the readout the same way hovering does on a desktop.
function showTipAt(clientX, clientY, touch) {
  if (!geo || data.t.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  // nearest point by x
  const targetT = geo.t0 + (mx - geo.padL) / geo.W * geo.tSpan;
  let best = 0, bestd = Infinity;
  for (let i = 0; i < data.t.length; i++) {
    const dd = Math.abs(data.t[i] - targetT);
    if (dd < bestd) { bestd = dd; best = i; }
  }
  hover = best;
  const tip = $('tip');
  tip.innerHTML =
    `${new Date(data.t[best]).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br>` +
    `<span class="t">${data.tempF[best].toFixed(1)}°F</span> · ` +
    `<span class="h">${data.hum[best].toFixed(1)}%</span>` +
    (() => {
      const bi = nearestBlu(data.t[best]);
      if (bi < 0) return '';
      return `<br>BLU <span class="b">${blu.tempF[bi].toFixed(1)}°F</span>` +
        (blu.hum[bi] != null ? ` · <span class="b">${blu.hum[bi].toFixed(0)}%</span>` : '') +
        ` (${fmtDiff(blu.tempF[bi] - data.tempF[best])}°F)`;
    })();
  tip.style.opacity = 1;
  // Sit the readout above the pointer, centred on the point, so neither the
  // cursor nor a fingertip covers it; flip below only when there's no room.
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const my = clientY - rect.top;
  const gap = touch ? 56 : 18;
  let tx = geo.x(data.t[best]) - tw / 2;
  tx = Math.min(Math.max(0, tx), canvas.clientWidth - tw);
  let ty = my - gap - th;
  if (ty < 0) ty = my + gap;
  tip.style.left = tx + 'px';
  tip.style.top = ty + 'px';
  draw();
}

function hideTip() { hover = null; $('tip').style.opacity = 0; draw(); }

canvas.addEventListener('mousemove', (e) => showTipAt(e.clientX, e.clientY));
canvas.addEventListener('mouseleave', hideTip);

canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  if (t) showTipAt(t.clientX, t.clientY, true);
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  if (t) showTipAt(t.clientX, t.clientY, true);
}, { passive: true });
canvas.addEventListener('touchend', hideTip);

window.addEventListener('resize', draw);

// ---- thermostat status ----------------------------------------------------
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function ageText(sec) {
  if (sec == null) return 'no reading yet';
  if (sec < 90) return 'reading ' + Math.round(sec) + ' s ago';
  if (sec < 5400) return 'reading ' + Math.round(sec / 60) + ' min ago';
  return 'reading ' + (sec / 3600).toFixed(1) + ' h ago';
}
async function loadStatus() {
  let st;
  try { st = await getJSON('/api/status'); } catch (e) { return; }
  let cfg = null;  // day and night setpoints; the status only carries the active one
  try { cfg = await getJSON('/api/settings'); } catch (e) { /* fall back below */ }
  const chips = [];
  if (st.temp_f != null) chips.push(`<span class="chip temp"><b>${st.temp_f.toFixed(1)}°F</b></span>`);
  const per = st.period === 'day' ? 'Day' : 'Night';
  if (cfg && cfg.day_setpoint_f != null && cfg.night_setpoint_f != null) {
    chips.push(`<span class="chip">Now <b>${per}</b></span>`);
    chips.push(`<span class="chip">Day set <b>${cfg.day_setpoint_f.toFixed(1)}°F</b> · Night set <b>${cfg.night_setpoint_f.toFixed(1)}°F</b></span>`);
  } else {
    chips.push(`<span class="chip">${per} · set <b>${st.setpoint_f.toFixed(1)}°F</b></span>`);
  }
  if (st.mode === 'off') {
    chips.push(`<span class="chip">Heater <b>OFF</b> (mode off)</span>`);
  } else if (st.heater_on == null) {
    chips.push(`<span class="chip">Heater <b>unknown</b></span>`);
  } else if (st.heater_on) {
    const w = st.apower_w != null ? ` ${Math.round(st.apower_w)} W` : '';
    chips.push(`<span class="chip on">Heater <b>ON${w}</b></span>`);
  } else {
    chips.push(`<span class="chip">Heater <b>OFF</b></span>`);
  }
  chips.push(`<span class="chip">${ageText(st.reading_age_s)}</span>`);
  // 24 h and 7 day temperature extremes. Decoration: a failure must not hide status.
  try {
    const stats = await getJSON('/api/stats');
    for (const [key, label] of [['24h', '24 h'], ['7d', '7 days']]) {
      const w = (stats.windows || []).find(w => w.key === key);
      if (w && w.tempMinF != null && w.tempMaxF != null)
        chips.push(`<span class="chip">${label} · high <b>${w.tempMaxF.toFixed(1)}°</b> · low <b>${w.tempMinF.toFixed(1)}°</b></span>`);
    }
  } catch (e) { /* keep the other chips */ }
  if (st.alert) chips.push(`<span class="chip alert">⚠ ${esc(st.alert.detail)}</span>`);
  $('status').innerHTML = chips.join('');
}

// ---- thermostat settings --------------------------------------------------
const NUMERIC = ['day_setpoint_f', 'night_setpoint_f', 'hysteresis_f', 'max_temp_f', 'stale_minutes', 'alert_below_f'];
function smsg(text, cls) { const m = $('smsg'); m.textContent = text || ''; m.className = cls || ''; }

async function loadSettings() {
  let s;
  try { s = await getJSON('/api/settings'); } catch (e) { smsg('Could not load settings.', 'err'); return; }
  const f = $('sform');
  for (const [k, v] of Object.entries(s)) {
    const el = f.elements[k];
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  }
  smsg('');
}

async function saveSettings(ev) {
  ev.preventDefault();
  const f = $('sform');
  const body = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') body[el.name] = el.checked;
    else if (NUMERIC.includes(el.name)) {
      const n = Number(el.value);
      if (el.value.trim() === '' || !isFinite(n)) { smsg(el.name + ' needs a number.', 'err'); el.focus(); return; }
      body[el.name] = el.name === 'stale_minutes' ? Math.round(n) : n;
    } else body[el.name] = el.value.trim();
  }
  smsg('Saving…');
  try {
    const res = await fetch('/api/settings', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), cache: 'no-store',
    });
    const type = res.headers.get('content-type') || '';
    if (res.redirected || !type.includes('application/json')) throw new SessionExpired();
    const out = await res.json();
    if (!res.ok) { smsg(out.error || ('HTTP ' + res.status), 'err'); return; }
    smsg('Saved.', 'ok');
    await loadSettings();
    smsg('Saved.', 'ok');
    // The controller acts on the change right away; show its result shortly.
    setTimeout(loadStatus, 1500);
  } catch (err) {
    if (err instanceof SessionExpired) reportError(err);
    else smsg('Could not reach orchidd — not saved.', 'err');
  }
}

// ---- boot + auto-refresh --------------------------------------------------
// The hi/lo lines derive from the loaded points, so one fetch refreshes both.
async function refresh() {
  await Promise.all([loadData(), loadStatus()]);
}

(async function () {
  const saved = (() => { try { return localStorage.getItem('orchidd-theme'); } catch (e) { return null; } })();
  applyTheme(saved === 'dark' ? 'dark' : 'light');   // default light
  applyFontStep(0);                                  // restore sticky text size
  $('fminus').onclick = () => applyFontStep(-1);
  $('fplus').onclick = () => applyFontStep(1);
  $('theme').onclick = () =>
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  $('sform').addEventListener('submit', saveSettings);
  // Fill the form when it opens, not on every refresh, so a refresh never
  // overwrites what someone is typing.
  $('settingsPanel').addEventListener('toggle', () => {
    if ($('settingsPanel').open) loadSettings();
  });

  // Meta only shapes the window selector; if it fails, loadData still reports
  // the real problem and the chart falls back to the default 7-day window.
  try { await loadMeta(); } catch (e) { /* reported by loadData */ }
  await refresh();

  setInterval(refresh, 60000); // refresh every minute

  // A Home Screen app is usually resumed from the background rather than
  // loaded fresh, so refresh on resume instead of showing a stale graph.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();
</script>
