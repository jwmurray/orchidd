<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orchidd — Temperature &amp; Humidity</title>

<!-- Installable web app: added to the iPhone Home Screen it launches full-screen
     with its own icon, no browser chrome. -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="orchidd" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<style>
  /* Light theme is the default. */
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --border: #e2e6eb; --grid: #c2cad6;
    --text: #1b2430; --muted: #5b6675; --temp: #d83a2f; --hum: #1668c9;
    --tipbg: #1b2430; --tiptext: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --border: #2a313c; --grid: #495468;
    --text: #c9d1d9; --muted: #8b949e; --temp: #ff6b4a; --hum: #4aa3ff;
    --tipbg: #0b0e12; --tiptext: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; }
  /* Respect the notch/home indicator when launched as a Home Screen app. */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right)); }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .now { color: var(--muted); font-size: 13px; }
  .now .t { color: var(--temp); font-weight: 600; }
  .now .h { color: var(--hum); font-weight: 600; }
  .spacer { flex: 1; }
  label { color: var(--muted); }
  select, .toggle { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
    font-size: 14px; cursor: pointer; }
  .toggle:hover { border-color: var(--grid); }
  main { padding: 16px 20px;
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
    padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .chartwrap { position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; }
  canvas { width: 100%; height: 62vh; display: block; touch-action: pan-y; }
  .legend { display: flex; gap: 18px; padding: 8px 4px 2px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #tip { position: absolute; pointer-events: none; background: var(--tipbg); color: var(--tiptext);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px;
    white-space: nowrap; opacity: 0; transition: opacity .05s; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  /* Connectivity / session banner. Hidden unless something needs saying. */
  #banner { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    font-size: 13px; }
  #banner[data-show] { display: block; }
  #banner button { margin-left: 8px; font: inherit; color: var(--hum);
    background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; }
  /* Phone layout: the header wraps to two lines and the chart gets more height. */
  @media (max-width: 560px) {
    header { gap: 10px 14px; padding: 12px 14px;
      padding-top: calc(12px + env(safe-area-inset-top)); }
    h1 { font-size: 15px; }
    .spacer { flex-basis: 100%; height: 0; }
    main { padding: 12px 14px; }
    canvas { height: 66vh; }
    .legend { flex-wrap: wrap; gap: 10px 14px; font-size: 12px; }
    #count { margin-left: 0 !important; }
  }
</style>
</head>
<body>
<header>
  <h1>🌡️ orchidd</h1>
  <span class="now" id="now">—</span>
  <span class="spacer"></span>
  <button id="theme" class="toggle" title="Toggle light/dark">Dark</button>
  <label>Show last
    <select id="days"></select>
  </label>
  <label>Hi/Lo
    <select id="stats">
      <option value="off">Off</option>
      <option value="24h">24 hours</option>
      <option value="48h">48 hours</option>
      <option value="7d">7 days</option>
      <option value="all">All three</option>
    </select>
  </label>
</header>
<main>
  <div id="banner"></div>
  <div class="chartwrap">
    <canvas id="chart"></canvas>
    <div id="tip"></div>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:var(--temp)"></i> Temperature (°F)</span>
    <span><i class="swatch" style="background:var(--hum)"></i> Humidity (%RH)</span>
    <span id="count" style="margin-left:auto"></span>
  </div>
  <div class="empty" id="empty" hidden>No data yet — waiting for the first report from the sensor.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let TEMP, HUM, GRID, MUTED;
function refreshColors() {
  const cs = getComputedStyle(document.documentElement);
  TEMP = cs.getPropertyValue('--temp').trim();
  HUM  = cs.getPropertyValue('--hum').trim();
  GRID = cs.getPropertyValue('--grid').trim();
  MUTED = cs.getPropertyValue('--muted').trim();
}
refreshColors();

// ---- preferences ----------------------------------------------------------
// Stored in localStorage, which is per-browser and per-device by definition:
// Safari on the iPhone, Chrome on the iMac and Safari on the laptop each keep
// their own theme, time window and hi/lo choice. Nothing is shared server-side.
function prefGet(key, fallback) {
  try { const v = localStorage.getItem('orchidd-' + key); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function prefSet(key, value) {
  try { localStorage.setItem('orchidd-' + key, String(value)); } catch (e) {}
}

// ---- theme (default light; toggle persisted per browser) ------------------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  prefSet('theme', t);
  $('theme').textContent = t === 'dark' ? 'Light' : 'Dark';
  refreshColors();
  draw();
}

let data = { t: [], tempF: [], hum: [] };
let stats = null;                              // /api/stats payload
let selectedDays = 7;
let statsMode = prefGet('stats', '24h');       // off | 24h | 48h | 7d | all
let hover = null; // index of hovered point

// ---- fetch helpers --------------------------------------------------------
// Three different failures look identical to a naive `await fetch(...).json()`,
// and each needs a different message:
//   * no network            -> show last cached data, say it's stale
//   * Access session expired -> Cloudflare answers with an HTML login page
//                               (or redirects to one); offer a sign-in tap
//   * server down            -> same as no network from the app's point of view
class SessionExpired extends Error {}

function setBanner(html) {
  const b = $('banner');
  if (!html) { b.removeAttribute('data-show'); b.innerHTML = ''; return; }
  b.innerHTML = html;
  b.setAttribute('data-show', '');
}

async function getJSON(path) {
  const res = await fetch(path, { cache: 'no-store' });
  const type = res.headers.get('content-type') || '';
  // A redirect to the Access login, or an HTML body where JSON belongs, both
  // mean "you are no longer signed in" rather than "the server is broken".
  if (res.redirected || !type.includes('application/json')) throw new SessionExpired();
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function reportError(err) {
  if (err instanceof SessionExpired) {
    setBanner('Session expired. <button onclick="location.reload()">Sign in again</button>');
  } else {
    const when = lastLoaded
      ? 'Showing data from ' + lastLoaded.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : 'No connection to orchidd';
    setBanner(`Offline — ${when}. <button onclick="refresh()">Retry</button>`);
  }
}

let lastLoaded = null;

async function loadMeta() {
  const m = await getJSON('/api/meta');
  const sel = $('days');
  sel.innerHTML = '';
  const max = m.maxDays || 7;
  // Sub-day windows first, then whole days up to the max.
  const opts = [
    { label: '1 hour', days: 1 / 24 },
    { label: '2 hours', days: 2 / 24 },
    { label: '4 hours', days: 4 / 24 },
    { label: '12 hours', days: 0.5 },
  ];
  for (let d = 1; d <= max; d++) {
    opts.push({ label: d === 1 ? '24 hours' : d + ' days', days: d });
  }
  for (const o of opts) {
    const el = document.createElement('option');
    el.value = String(o.days); el.textContent = o.label;
    sel.appendChild(el);
  }

  // Remembered window wins over the server's suggestion, but only if it is
  // still offered — the day-length options grow as history accumulates, so a
  // saved "5 days" must not silently select nothing after a database reset.
  const saved = prefGet('days', null);
  const available = [...sel.options].map((o) => o.value);
  selectedDays = saved !== null && available.includes(saved)
    ? +saved
    : (m.defaultDays || 7);
  sel.value = String(selectedDays);
  sel.onchange = () => {
    selectedDays = +sel.value;
    prefSet('days', sel.value);
    loadData();
  };
}

async function loadData() {
  try {
    data = await getJSON('/api/data?days=' + selectedDays);
    lastLoaded = new Date();
    setBanner(null);
  } catch (err) {
    reportError(err);
    return;
  }
  const n = data.t.length;
  $('empty').hidden = n > 0;
  $('count').textContent = n ? n + ' points' : '';
  if (n) {
    const i = n - 1;
    $('now').innerHTML =
      `now <span class="t">${data.tempF[i].toFixed(1)}°F</span> · ` +
      `<span class="h">${data.hum[i].toFixed(1)}%</span>`;
  } else {
    $('now').textContent = '—';
  }
  draw();
}

// ---- hi/lo summary lines --------------------------------------------------
// Each window gets its own dash pattern so three overlapping pairs stay
// tellable apart; colour still encodes the metric, matching the series.
const STAT_WINDOWS = {
  '24h': { label: '24h', dash: [7, 4] },
  '48h': { label: '48h', dash: [2, 3] },
  '7d':  { label: '7d',  dash: [11, 3, 2, 3] },
};

async function loadStats() {
  try { stats = await getJSON('/api/stats'); } catch (e) { stats = null; }
}

/// The windows currently selected for display, newest-window-first.
function activeStatWindows() {
  if (!stats || statsMode === 'off') return [];
  const keys = statsMode === 'all' ? ['24h', '48h', '7d'] : [statsMode];
  return stats.windows.filter((w) => keys.includes(w.key) && w.count > 0);
}

/// Every hi/lo value being drawn, so the axes can be scaled to include them —
/// otherwise a 7-day high sits off-screen while you are viewing the last hour.
function statValues(windows) {
  const temps = [], hums = [];
  for (const w of windows) {
    if (w.tempMinF != null) temps.push(w.tempMinF, w.tempMaxF);
    if (w.humMin != null) hums.push(w.humMin, w.humMax);
  }
  return { temps, hums };
}

// ---- scale helpers --------------------------------------------------------
// Range padded by 10% beyond the data extent, per requirement, but never
// tighter than `minSpan` so near-flat data doesn't produce a weird micro-range.
function paddedRange(arr, minSpan) {
  let lo = Infinity, hi = -Infinity;
  for (const v of arr) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!isFinite(lo)) return [0, minSpan || 1];
  const range = hi - lo;
  const pad = range > 0 ? range * 0.10 : Math.max((minSpan || 2) / 2, Math.abs(hi) * 0.05);
  let a = lo - pad, b = hi + pad;
  if (minSpan && b - a < minSpan) { const m = (a + b) / 2; a = m - minSpan / 2; b = m + minSpan / 2; }
  return [a, b];
}

// Nice axis covering [lo,hi] with round min/max/step (~targetTicks intervals).
// Temperature uses this to pick the shared gridlines.
function niceAxisCover(lo, hi, targetTicks) {
  const step = niceNum(((hi - lo) || 1) / Math.max(1, targetTicks), true);
  const min = Math.floor(lo / step) * step;
  const max = Math.ceil(hi / step) * step;
  const count = Math.max(1, Math.round((max - min) / step));
  return { min, max, step, count };
}

// Fit [lo,hi] into EXACTLY k intervals using the smallest nice step that covers
// the range from a nice-aligned min — so humidity's round labels land on the
// SAME horizontal lines the temperature axis already defined.
function fitToCount(lo, hi, k) {
  let step = niceNum(((hi - lo) || 1) / k, true) || 1;
  for (let it = 0; it < 40; it++) {
    const min = Math.floor(lo / step) * step;
    if (min + k * step >= hi - 1e-9) return { min, max: min + k * step, step, count: k };
    step = niceNumNext(step);
  }
  const min = Math.floor(lo / step) * step;
  return { min, max: min + k * step, step, count: k };
}

function niceNum(x, round) {
  x = Math.abs(x) || 1;
  const exp = Math.floor(Math.log10(x));
  const f = x / Math.pow(10, exp);
  const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
                   : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
  return nf * Math.pow(10, exp);
}
function niceNumNext(step) {          // next nice number up: 1→2→5→10…
  const exp = Math.floor(Math.log10(step) + 1e-9);
  const f = Math.round(step / Math.pow(10, exp));
  const nf = f < 2 ? 2 : f < 5 ? 5 : 10;
  return nf * Math.pow(10, exp);
}
function decimalsForStep(step) { return step >= 1 ? 0 : step >= 0.1 ? 1 : 2; }

// ---- drawing --------------------------------------------------------------
const canvas = $('chart');
const ctx = canvas.getContext('2d');
let geo = null; // saved geometry for hit-testing

function draw() {
  refreshColors();
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const n = data.t.length;
  const padL = 52, padR = 52, padT = 12, padB = 28;
  const W = cssW - padL - padR, H = cssH - padT - padB;
  if (n === 0 || W <= 0 || H <= 0) { geo = null; return; }

  // Time axis is anchored to the selected window with "now" at the right edge,
  // so labels show real times even when only a few points exist yet.
  const t1 = Date.now();
  const t0 = t1 - selectedDays * 86400 * 1000;
  const tSpan = Math.max(1, t1 - t0);
  // Temperature drives the gridlines (10% padding, rounded to clean values);
  // humidity is then fitted onto those SAME lines with its own round step.
  // Hi/lo lines are part of the picture, so they participate in the range.
  const statWins = activeStatWindows();
  const sv = statValues(statWins);
  const [tLoPad, tHiPad] = paddedRange(data.tempF.concat(sv.temps), 4); // 10% pad, >= 4 °F
  const [hLoPad, hHiPad] = paddedRange(data.hum.concat(sv.hums), 8);    // >= 8 %RH tall
  // Fewer target gridlines => humidity fits the shared lines with less empty
  // headroom (each temperature line still gets a matching humidity value).
  const tAxis = niceAxisCover(tLoPad, tHiPad, 5);
  const k = tAxis.count;
  const hAxis = fitToCount(hLoPad, hHiPad, k);
  const tDec = decimalsForStep(tAxis.step);
  const hDec = decimalsForStep(hAxis.step);

  const x = (t) => padL + (t - t0) / tSpan * W;
  const yT = (v) => padT + (1 - (v - tAxis.min) / (tAxis.max - tAxis.min)) * H;
  const yH = (v) => padT + (1 - (v - hAxis.min) / (hAxis.max - hAxis.min)) * H;
  geo = { padL, padT, W, H, x, t0, tSpan };

  // Shared horizontal gridlines: one per interval, temp label left, humidity right.
  ctx.font = '11px sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= k; i++) {
    const yy = padT + H - (H * i / k);
    ctx.strokeStyle = GRID; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + W, yy); ctx.stroke();
    ctx.fillStyle = TEMP; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText((tAxis.min + i * tAxis.step).toFixed(tDec) + '°', padL - 6, yy);
    ctx.fillStyle = HUM; ctx.textAlign = 'left';
    ctx.fillText((hAxis.min + i * hAxis.step).toFixed(hDec) + '%', padL + W + 6, yy);
  }

  // x-axis time labels
  ctx.fillStyle = MUTED; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const labels = 6;
  for (let i = 0; i <= labels; i++) {
    const tt = t0 + tSpan * i / labels;
    const xx = padL + W * i / labels;
    ctx.fillText(fmtTime(tt, tSpan), xx, padT + H + 6);
  }

  // hi/lo reference lines, drawn under the series so live data stays dominant
  drawStatLines(statWins, yT, yH, padL, W, padT, H);

  // series
  drawLine(data.t, data.tempF, yT, TEMP);
  drawLine(data.t, data.hum, yH, HUM);

  // Mark the most recent sample (all samples when very sparse) so a lone or
  // just-started reading is always visible.
  const markIdx = n <= 2 ? [...Array(n).keys()] : [n - 1];
  for (const i of markIdx) {
    const px = x(data.t[i]);
    dot(px, yT(data.tempF[i]), TEMP);
    dot(px, yH(data.hum[i]), HUM);
  }

  // hover marker
  if (hover != null && hover >= 0 && hover < n) {
    const hx = x(data.t[hover]);
    ctx.strokeStyle = MUTED; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, padT + H); ctx.stroke();
    ctx.globalAlpha = 1;
    dot(hx, yT(data.tempF[hover]), TEMP);
    dot(hx, yH(data.hum[hover]), HUM);
  }
}

function drawLine(ts, vs, yf, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1.75; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < ts.length; i++) {
    const px = geo.x(ts[i]), py = yf(vs[i]);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
/// Draw the hi/lo reference lines with an inline label on each.
///
/// Temperature labels hug the left of the plot and humidity labels the right,
/// matching the side each metric's axis is on. When several windows are shown
/// at once their labels are staggered horizontally so equal values don't stack
/// on top of each other.
function drawStatLines(windows, yT, yH, padL, W, padT, H) {
  if (!windows.length) return;
  const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();

  ctx.save();
  ctx.font = '10px sans-serif';
  ctx.textBaseline = 'bottom';
  ctx.lineWidth = 1.25;

  const line = (value, yf, color, text, side, slot) => {
    if (value == null) return;
    const y = yf(value);
    if (y < padT - 0.5 || y > padT + H + 0.5) return; // outside the plot

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + W, y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    const w = ctx.measureText(text).width;
    const stagger = Math.min(slot * (w + 16), Math.max(0, W - w - 12));
    const x = side === 'left'
      ? padL + 5 + stagger
      : padL + W - 5 - stagger - w;
    // A chip of panel colour keeps the label readable where it crosses a
    // gridline or the series itself.
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = panel;
    ctx.fillRect(x - 3, y - 12, w + 6, 12);
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.fillText(text, x, y - 1.5);
  };

  windows.forEach((w, i) => {
    const tag = STAT_WINDOWS[w.key].label;
    ctx.setLineDash(STAT_WINDOWS[w.key].dash);
    line(w.tempMaxF, yT, TEMP, `${tag} hi ${w.tempMaxF?.toFixed(1)}°`, 'left', i);
    line(w.tempMinF, yT, TEMP, `${tag} lo ${w.tempMinF?.toFixed(1)}°`, 'left', i);
    line(w.humMax, yH, HUM, `${tag} hi ${w.humMax?.toFixed(1)}%`, 'right', i);
    line(w.humMin, yH, HUM, `${tag} lo ${w.humMin?.toFixed(1)}%`, 'right', i);
  });

  ctx.setLineDash([]);
  ctx.restore();
}

function dot(px, py, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 7); ctx.fill();
}

function fmtTime(ms, span) {
  const d = new Date(ms);
  const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (span > 36 * 3600 * 1000) // more than ~1.5 days: show date
    return d.toLocaleDateString([], { month: 'numeric', day: 'numeric' });
  return hm;
}

// ---- hover / tooltip ------------------------------------------------------
// Driven by both mouse and touch: on a phone, dragging along the chart scrubs
// the readout the same way hovering does on a desktop.
function showTipAt(clientX, clientY) {
  if (!geo || data.t.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  // nearest point by x
  const targetT = geo.t0 + (mx - geo.padL) / geo.W * geo.tSpan;
  let best = 0, bestd = Infinity;
  for (let i = 0; i < data.t.length; i++) {
    const dd = Math.abs(data.t[i] - targetT);
    if (dd < bestd) { bestd = dd; best = i; }
  }
  hover = best;
  const tip = $('tip');
  tip.innerHTML =
    `${new Date(data.t[best]).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br>` +
    `<span style="color:${TEMP}">${data.tempF[best].toFixed(1)}°F</span> · ` +
    `<span style="color:${HUM}">${data.hum[best].toFixed(1)}%</span>`;
  tip.style.opacity = 1;
  let tx = geo.x(data.t[best]) + 12;
  if (tx + 150 > canvas.clientWidth) tx = geo.x(data.t[best]) - 150;
  tip.style.left = Math.max(0, tx) + 'px';
  tip.style.top = (clientY - rect.top - 10) + 'px';
  draw();
}

function hideTip() { hover = null; $('tip').style.opacity = 0; draw(); }

canvas.addEventListener('mousemove', (e) => showTipAt(e.clientX, e.clientY));
canvas.addEventListener('mouseleave', hideTip);

canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  if (t) showTipAt(t.clientX, t.clientY);
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  if (t) showTipAt(t.clientX, t.clientY);
}, { passive: true });
canvas.addEventListener('touchend', hideTip);

window.addEventListener('resize', draw);

// ---- boot + auto-refresh --------------------------------------------------
// Readings and hi/lo summaries are fetched together so the lines never lag a
// refresh cycle behind the series they annotate.
async function refresh() {
  await Promise.all([loadData(), loadStats()]);
  draw();
}

(async function () {
  const saved = (() => { try { return localStorage.getItem('orchidd-theme'); } catch (e) { return null; } })();
  applyTheme(saved === 'dark' ? 'dark' : 'light');   // default light
  $('theme').onclick = () =>
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  const statsSel = $('stats');
  const STATS_CHOICES = ['off', '24h', '48h', '7d', 'all'];
  if (!STATS_CHOICES.includes(statsMode)) statsMode = '24h';
  statsSel.value = statsMode;
  statsSel.onchange = () => {
    statsMode = statsSel.value;
    prefSet('stats', statsMode);
    draw();
  };

  // Meta only shapes the window selector; if it fails, loadData still reports
  // the real problem and the chart falls back to the default 7-day window.
  try { await loadMeta(); } catch (e) { /* reported by loadData */ }
  await refresh();

  setInterval(refresh, 60000); // refresh every minute

  // A Home Screen app is usually resumed from the background rather than
  // loaded fresh, so refresh on resume instead of showing a stale graph.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
